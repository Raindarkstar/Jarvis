name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y portaudio19-dev libasound2-dev python3-gi python3-cairo gir1.2-gtk-3.0 gir1.2-webkit2-4.1

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Validate command-line entry points
        run: |
          python -m jarvis_cli --version
          python -m jarvis_cli doctor --json > doctor-report.json || test $? -eq 1
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path("doctor-report.json").read_text())
          assert report and all(set(item) == {"name", "status", "detail", "optional"} for item in report)
          PY

      - name: Validate shell scripts
        run: bash -n install.sh jarvis-client.sh rain-ai-client.sh

      - name: Run Unit Tests
        run: |
          python -m unittest discover -s tests -v

  windows-smoke:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Windows client dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install --editable .

      - name: Smoke test Windows client
        shell: pwsh
        run: |
          python -c "import webview; import windows_client; client=windows_client.WindowsClient(); assert client.html_path.is_file(); print('Windows WebView2 client import OK')"
          python -m jarvis_cli --version
          $env:DASHSCOPE_API_KEY = "ci-smoke-key"
          python -m jarvis_cli doctor --json > doctor-report.json
          python -c "import json; report=json.load(open('doctor-report.json', encoding='utf-8')); assert any(item['name'] == 'pywebview/WebView2' and item['status'] == 'ok' for item in report)"
          python -m unittest tests.test_windows_client -v
