name: Feature request
description: 提议一个可验证的新功能或改进
title: "[Feature] "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 说明当前工作流中的痛点，以及谁会受益。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 描述你希望 Jarvis 如何工作；如果有替代方案也请一并说明。
    validations:
      required: true
  - type: textarea
    id: constraints
    attributes:
      label: 约束与安全考虑
      description: 是否涉及隐私、系统权限、Wayland/X11 或联网依赖？
