name: Bug report
description: 报告一个可复现的问题
title: "[Bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈！请先运行 `jarvis doctor`，并在下面粘贴与问题相关的诊断结果。
  - type: textarea
    id: description
    attributes:
      label: 问题描述
      description: 清楚说明发生了什么，以及你期望发生什么。
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤
      placeholder: |
        1. 执行 ...
        2. 点击 ...
        3. 看到 ...
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: 环境信息
      description: 请提供发行版、桌面会话（X11/Wayland）、Python 版本和相关 doctor 输出；不要粘贴 API Key。
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 日志或截图
      render: shell
